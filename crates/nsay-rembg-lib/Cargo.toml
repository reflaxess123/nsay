[package]
name = "nsay-rembg-lib"
version = "0.1.0"
edition = "2021"
description = "Shared rembg sidecar logic (BRIA-RMBG preprocessing/inference/postprocessing). Each backend bin (cpu/cuda/dml) is a thin wrapper that registers its execution provider and calls run()."

[workspace]

[lib]
name = "nsay_rembg_lib"
path = "src/lib.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray"] }

ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imageproc = "0.25"

anyhow = "1"
