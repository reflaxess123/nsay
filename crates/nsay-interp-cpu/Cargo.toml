[package]
name = "nsay-interp-cpu"
version = "0.1.0"
edition = "2021"
description = "CPU frame interpolation sidecar for nsay (RIFE via ONNX Runtime)"

[workspace]

[[bin]]
name = "nsay-interp-cpu"
path = "src/main.rs"

[dependencies]
nsay-interp-lib = { path = "../nsay-interp-lib" }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
