[package]
name = "nsay-rembg-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime + cuDNN)"

# Standalone workspace — keep ort's `cuda` feature out of any sibling
# CPU/DML/CoreML build.
[workspace]

[[bin]]
name = "nsay-rembg-cuda"
path = "src/main.rs"

[dependencies]
# Pipeline logic + image deps from shared lib. We add ort directly with
# the `cuda` feature so cargo feature-unifies it into the lib's transitive
# ort dep — that's what makes CUDAExecutionProvider available in
# `nsay_rembg_lib::ort::execution_providers`.
nsay-rembg-lib = { path = "../nsay-rembg-lib" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "cuda"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
