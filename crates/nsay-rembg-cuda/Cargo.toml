[package]
name = "nsay-rembg-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime + cuDNN)"

# Standalone workspace — keep ort's `cuda` feature out of any sibling
# CPU/DML/CoreML build.
[workspace]

[[bin]]
name = "nsay-rembg-cuda"
path = "src/main.rs"

[dependencies]
# `cuda` feature pulls the CUDA EP into the prebuilt onnxruntime that
# `download-binaries` fetches. Requires NVIDIA driver + cuDNN/cuBLAS DLLs
# at runtime (staged by scripts/build-sidecars.ps1).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "cuda"] }

ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imageproc = "0.25"

anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
