[package]
name = "nsay-vidsr-docker"
version = "0.1.0"
edition = "2021"
description = "Docker-based VSR sidecar for nsay (FlashVSR-Pro inside flashvsr-pro:latest image)"

[workspace]

[[bin]]
name = "nsay-vidsr-docker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
