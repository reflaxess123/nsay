[package]
name = "nsay-upscale-cpu"
version = "0.1.0"
edition = "2021"
description = "CPU super-resolution sidecar for nsay (Real-ESRGAN via ONNX Runtime)"

[workspace]

[[bin]]
name = "nsay-upscale-cpu"
path = "src/main.rs"

[dependencies]
# All pipeline logic + ort + image deps come from the shared lib crate.
# CPU sidecar passes the identity closure — no EP registered.
nsay-upscale-lib = { path = "../nsay-upscale-lib" }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
