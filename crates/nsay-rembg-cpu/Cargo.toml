[package]
name = "nsay-rembg-cpu"
version = "0.1.0"
edition = "2021"
description = "CPU background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime)"

# Standalone workspace so the parent's resolver can't unify ort features
# (cuda / directml / coreml) into this CPU-only build.
[workspace]

[[bin]]
name = "nsay-rembg-cpu"
path = "src/main.rs"

[dependencies]
# ort 2.x — Rust API over ONNX Runtime C++. CPU EP is the default; no
# extra features = no GPU dependencies.
# `download-binaries` makes ort fetch the prebuilt onnxruntime native lib
# at build time so we don't need a system install. `ndarray` feature
# enables the `Tensor::from_array` convenience used below.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray"] }

ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imageproc = "0.25"

anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
