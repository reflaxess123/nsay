[package]
name = "nsay-rembg-cpu"
version = "0.1.0"
edition = "2021"
description = "CPU background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime)"

# Standalone workspace so the parent's resolver can't unify ort features
# (cuda / directml / coreml) into this CPU-only build.
[workspace]

[[bin]]
name = "nsay-rembg-cpu"
path = "src/main.rs"

[dependencies]
# All pipeline logic + ort + image deps come from the shared lib crate.
# CPU sidecar passes the identity closure — no EP registered, runs on
# the default CPU EP that ort always provides.
nsay-rembg-lib = { path = "../nsay-rembg-lib" }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
