[package]
name = "nsay-interp-dml"
version = "0.1.0"
edition = "2021"
description = "DirectML frame interpolation sidecar for nsay (RIFE via ONNX Runtime + DML)"

[workspace]

[[bin]]
name = "nsay-interp-dml"
path = "src/main.rs"

[dependencies]
nsay-interp-lib = { path = "../nsay-interp-lib" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "directml"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
