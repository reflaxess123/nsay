[package]
name = "nsay-upscale-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA super-resolution sidecar for nsay (Real-ESRGAN via ONNX Runtime + cuDNN)"

[workspace]

[[bin]]
name = "nsay-upscale-cuda"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "cuda"] }

ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
