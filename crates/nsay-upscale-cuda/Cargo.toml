[package]
name = "nsay-upscale-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA super-resolution sidecar for nsay (Real-ESRGAN via ONNX Runtime + cuDNN)"

[workspace]

[[bin]]
name = "nsay-upscale-cuda"
path = "src/main.rs"

[dependencies]
# Pipeline logic + image deps from shared lib. ort declared directly with
# `cuda` feature so cargo unifies it into the lib's transitive ort dep.
nsay-upscale-lib = { path = "../nsay-upscale-lib" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "cuda"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
