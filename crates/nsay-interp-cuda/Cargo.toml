[package]
name = "nsay-interp-cuda"
version = "0.1.0"
edition = "2021"
description = "CUDA frame interpolation sidecar for nsay (RIFE via ONNX Runtime + cuDNN)"

# Standalone workspace — keep ort's `cuda` feature out of any sibling
# CPU/DML/CoreML build.
[workspace]

[[bin]]
name = "nsay-interp-cuda"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "cuda"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
