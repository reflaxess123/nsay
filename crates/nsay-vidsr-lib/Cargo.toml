[package]
name = "nsay-vidsr-lib"
version = "0.1.0"
edition = "2021"
description = "Shared video super-resolution sidecar logic (RealBasicVSR via tch-rs / libtorch). Each backend bin (cpu/cuda) is a thin wrapper that picks the device and calls run()."

[workspace]

[lib]
name = "nsay_vidsr_lib"
path = "src/lib.rs"

[dependencies]
# tch — Rust bindings to libtorch. Build script looks for the LIBTORCH env
# var pointing at the directory `scripts/fetch-libtorch.ps1` extracts to
# (src-tauri/binaries/libtorch). Pin to a version that matches the libtorch
# zip default (2.6.0); bump in lockstep with fetch-libtorch.ps1 -Version.
tch = "0.19"

anyhow = "1"
