[package]
name = "nsay-rembg-dml"
version = "0.1.0"
edition = "2021"
description = "DirectML background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime + DirectML)"

# Standalone workspace.
[workspace]

[[bin]]
name = "nsay-rembg-dml"
path = "src/main.rs"

[dependencies]
# DirectML EP works on any DirectX 12 GPU on Windows 10+ (AMD / Intel /
# NVIDIA). Requires DirectML.dll alongside the binary — `download-binaries`
# does NOT ship it; build-sidecars.ps1 copies it from the system or a
# vendored copy.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "directml"] }

ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
imageproc = "0.25"

anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
