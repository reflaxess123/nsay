[package]
name = "nsay-rembg-dml"
version = "0.1.0"
edition = "2021"
description = "DirectML background-removal sidecar for nsay (BRIA-RMBG via ONNX Runtime + DirectML)"

# Standalone workspace.
[workspace]

[[bin]]
name = "nsay-rembg-dml"
path = "src/main.rs"

[dependencies]
# Pipeline logic + image deps from shared lib. We add ort directly with
# the `directml` feature so cargo feature-unifies it into the lib's
# transitive ort dep — that's what makes DirectMLExecutionProvider
# available in `nsay_rembg_lib::ort::execution_providers`.
nsay-rembg-lib = { path = "../nsay-rembg-lib" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["download-binaries", "ndarray", "directml"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
