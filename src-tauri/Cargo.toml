[package]
name = "nsay_app"
version = "0.1.0"
edition = "2021"
description = "nsay — local AI image/video toolkit"

[lib]
name = "nsay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# No ML/inference here — all of that lives in crates/nsay-*-* sidecars,
# spawned via std::process::Command. The main app stays toolchain-light.

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"
toml_edit = "0.22"

# Error handling
anyhow = "1"

# HTTP for model downloads from Hugging Face
ureq = { version = "3", features = ["json"] }

# SHA-256 for downloaded model verification (skipped if catalog entry
# has empty sha256 — migration is gradual).
sha2 = "0.10"

# Cross-platform user-data dir (%APPDATA%/nsay/ on Win, ~/.local/share/nsay
# on Linux, ~/Library/Application Support/nsay on Mac). Models live there
# by default — that's the same place where every other consumer ML app
# (Topaz, etc.) puts multi-GB downloaded weights, and it doesn't depend
# on where the exe is.
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# profile.release lives in workspace root
